apiVersion: apps/v1
kind: Deployment
metadata:
  name: digest-diff
  labels:
    app: digest-diff
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: digest-diff
  template:
    metadata:
      labels:
        app: digest-diff
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: digest-diff
          image: ghcr.io/peddavid/secops/digest-diff:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CACHE_DIR
              value: /var/cache/digest-diff
            - name: PORT
              value: "8080"
            - name: SCAN_TTL
              value: 6h
            - name: SCAN_TIMEOUT
              value: 15m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/digest-diff
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: cache
          persistentVolumeClaim:
            claimName: digest-diff-cache
