name: digest-diff Helm chart
on:
  pull_request:
    paths: ['digest-diff/charts/**', '.github/workflows/digest-diff-chart.yml']
  push:
    branches: [main]
    paths: ['digest-diff/charts/**', '.github/workflows/digest-diff-chart.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Lint and render supported configurations
        shell: bash
        run: |
          set -euo pipefail
          chart=digest-diff/charts/digest-diff
          helm lint --strict "$chart"
          helm template digest-diff "$chart" --namespace secops > "$RUNNER_TEMP/default.yaml"
          helm template digest-diff "$chart" --set persistence.existingClaim=existing-cache > "$RUNNER_TEMP/existing.yaml"
          helm template digest-diff "$chart" --set persistence.enabled=false > "$RUNNER_TEMP/ephemeral.yaml"
          helm template digest-diff "$chart" --set ingress.enabled=true --set ingress.className=nginx > "$RUNNER_TEMP/ingress.yaml"
          helm package "$chart" --destination "$RUNNER_TEMP/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-diff-helm-chart
          path: ${{ runner.temp }}/charts/*.tgz
          if-no-files-found: error
