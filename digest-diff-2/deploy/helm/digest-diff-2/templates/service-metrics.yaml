apiVersion: v1
kind: Service
metadata:
  name: {{ include "digest-diff-2.fullname" . }}-metrics
  labels:
    {{- include "digest-diff-2.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "digest-diff-2.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
