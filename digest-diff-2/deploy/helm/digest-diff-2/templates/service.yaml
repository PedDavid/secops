apiVersion: v1
kind: Service
metadata:
  name: {{ include "digest-diff-2.fullname" . }}
  labels:
    {{- include "digest-diff-2.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "digest-diff-2.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
