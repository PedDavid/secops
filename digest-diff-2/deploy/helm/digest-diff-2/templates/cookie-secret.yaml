{{- if not .Values.cookieKey.existingSecret }}
{{- $name := include "digest-diff-2.cookieSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "digest-diff-2.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "cookie-key") }}
  cookie-key: {{ index $existing.data "cookie-key" }}
  {{- else }}
  cookie-key: {{ randAlphaNum 96 | b64enc | b64enc }}
  {{- end }}
{{- end }}
